<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DecideFácil</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <style>
body {
  background: red !important;
}
  </style>

<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">
    <button class="icon-btn" id="configBtn">⚙️</button>

    <div class="right-buttons">
      <button class="premium-btn" id="premiumBtn">Premium</button>
      <button class="ads-btn" id="adsBtn">Anuncios</button>
    </div>
  </header>

  <!-- TÍTULO -->
  <h1 class="title">DecideFácil</h1>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <!-- BOTONES PRINCIPALES -->
    <div class="main-buttons">
      <button class="main-btn" id="decidirBtn">DECIDE POR MÍ</button>
      <button class="main-btn secondary" id="preguntarBtn">PREGUNTA A LA IA</button>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chat"></div>

    <!-- INPUT -->
    <div class="input-area">
      <input
        type="text"
        id="input"
        placeholder="Escribe aquí tu duda..."
      />
      <button class="send-btn" id="sendBtn">Enviar</button>
    </div>

  </main>

  <!-- PANEL CONFIGURACIÓN -->
  <section class="panel hidden" id="panelConfig">
    <h2>Configuración</h2>
    <p>Aquí irán ajustes futuros.</p>
    <button class="back-btn">Volver</button>
  </section>

  <!-- PANEL PREMIUM -->
  <section class="panel hidden" id="panelPremium">
    <h2>Premium</h2>
    <ul>
      <li>Sin anuncios</li>
      <li>Respuestas más largas</li>
      <li>Prioridad de IA</li>
    </ul>
    <button class="back-btn">Volver</button>
  </section>

  <!-- PANEL ANUNCIOS -->
  <section class="panel hidden" id="panelAds">
    <h2>Anuncios</h2>
    <p>Los anuncios ayudan a mantener DecideFácil gratis.</p>
    <button class="back-btn">Volver</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
