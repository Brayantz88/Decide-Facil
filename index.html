<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DecideFácil</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- BARRA SUPERIOR -->
  <header class="top-bar">

    <!-- CONFIGURACIÓN -->
    <button id="btn-config" class="icon-btn">
      ⚙️
    </button>

    <!-- TÍTULO -->
    <h1 class="title">
      DecideFácil
    </h1>

    <!-- BOTONES DERECHA -->
    <div class="top-actions">
      <button id="btn-premium" class="premium-btn">
        Premium
      </button>

      <button id="btn-ads" class="ads-btn">
        Anuncios
      </button>
    </div>

  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <!-- CHAT -->
    <div class="chat-box" id="chat">
      <!-- Aquí aparecerán los mensajes -->
    </div>

    <!-- INPUT + BOTÓN -->
    <div class="input-area">

      <input
        type="text"
        id="input"
        placeholder="Escribe aquí tu duda..."
        autocomplete="off"
      >

      <button id="decidir" class="main-btn">
        DECIDIR
      </button>

    </div>

  </main>

  <!-- PANEL CONFIGURACIÓN -->
  <section id="panel-config" class="panel hidden">
    <h2>Configuración</h2>

    <p>Aquí irán las opciones de la app.</p>

    <button class="back-btn">
      Volver
    </button>
  </section>

  <!-- PANEL PREMIUM -->
  <section id="panel-premium" class="panel hidden">
    <h2>Premium</h2>

    <ul>
      <li>✔ Sin anuncios</li>
      <li>✔ Respuestas más rápidas</li>
      <li>✔ Acceso total a los botones</li>
    </ul>

    <button class="back-btn">
      Volver
    </button>
  </section>

  <!-- PANEL ANUNCIOS -->
  <section id="panel-ads" class="panel hidden">
    <h2>Anuncios</h2>

    <p>Aquí se mostrarán los anuncios.</p>

    <button class="back-btn">
      Volver
    </button>
  </section>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
