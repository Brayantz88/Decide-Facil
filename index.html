<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DecideFácil</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TÍTULO FIJO -->
  <h1 class="title">DecideFácil</h1>

  <!-- BOTONES SUPERIORES -->
  <div class="top-buttons">
  <button class="config-btn" id="configBtn">⚙</button>

  <div class="right-buttons">
    <button class="premium-btn" id="premiumBtn">Premium</button>
    <button class="ads-btn" id="adsBtn">Anuncios</button>
  </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <!-- CHAT -->
    <div class="chat-box" id="chat">
      <!-- Mensajes aquí -->
    </div>

    <!-- ENTRADA -->
    <div class="input-area">
      <input 
        type="text" 
        id="input" 
      >
      <button id="decidir" class="main-btn">
        DECIDIR
      </button>
    </div>

    <!-- BOTONES PRINCIPALES -->
  <div class="main-actions">
  <button class="action-btn" id="btnDecidir">DECIDE POR MÍ</button>
  <button class="action-btn" id="btnPregunta">PREGUNTA A LA IA</button>
  </div>

  </main>

  <!-- PANEL PREMIUM -->
  <section class="panel hidden" id="panel-premium">
    <h2>Premium</h2>
    <ul>
      <li>Sin anuncios</li>
      <li>Respuestas más largas</li>
      <li>Prioridad de IA</li>
    </ul>
    <button class="back-btn">Volver</button>
  </section>

  <!-- PANEL ANUNCIOS -->
  <section class="panel hidden" id="panel-ads">
    <h2>Anuncios</h2>
    <p>Los anuncios ayudan a mantener DecideFácil gratis.</p>
    <button class="back-btn">Volver</button>
  </section>
  
  <section class="panel hidden" id="panel-config">
  <h2>Configuración</h2>
  <p>Aquí irá tu configuración.</p>
  <button class="back-btn">Volver</button>
  </section>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
