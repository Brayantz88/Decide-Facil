<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DecideFácil</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- TÍTULO FIJO -->
  <h1 class="title">DecideFácil</h1>

  <!-- BOTONES SUPERIORES -->
  <div class="top-buttons">
    <button class="config-btn" id="configBtn">⚙</button>

    <div class="right-buttons">
      <button class="premium-btn" id="premiumBtn">Premium</button>
      <button class="ads-btn" id="adsBtn">Anuncios</button>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <!-- =========================
         PANTALLA HOME (INICIO)
    ========================= -->
    <section id="screen-home">

      <div class="main-actions">
        <button class="action-btn" id="btnDecidir">DECIDE POR MÍ</button>
        <button class="action-btn" id="btnPregunta">PREGUNTA A LA IA</button>
      </div>

    </section>

    <!-- =========================
         PANTALLA CHAT (TIPO GPT)
    ========================= -->
    <section id="screen-chat" class="hidden">

      <button id="btnBack" class="back-chat">← Volver</button>

      <div class="chat-box" id="chat"></div>

      <div class="input-area" id="inputArea">
        <input type="text" id="input" placeholder="Escribí aquí..." />
        <button id="decidir" class="main-btn">ENVIAR</button>
      </div>

    </section>

  </main>

  <!-- PANEL PREMIUM -->
  <section class="panel hidden" id="panel-premium">
    <h2>Premium</h2>
    <ul>
      <li>Sin anuncios</li>
      <li>Respuestas más largas</li>
      <li>Prioridad de IA</li>
    </ul>
    <button class="back-btn">Volver</button>
  </section>

  <!-- PANEL ANUNCIOS -->
  <section class="panel hidden" id="panel-ads">
    <h2>Anuncios</h2>
    <p>Los anuncios ayudan a mantener DecideFácil gratis.</p>
    <button class="back-btn">Volver</button>
  </section>

  <!-- PANEL CONFIG -->
  <section class="panel hidden" id="panel-config">
    <h2>Configuración</h2>
    <p>Aquí irá tu configuración.</p>
    <button class="back-btn">Volver</button>
  </section>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
