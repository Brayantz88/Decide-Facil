<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DecideFácil</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- TÍTULO FIJO -->
  <h1 class="title">DecideFácil</h1>

  <!-- BOTONES SUPERIORES -->
  <div class="top-buttons">
    <button class="config-btn" id="configBtn">⚙</button>

    <div class="right-buttons">
      <button class="premium-btn" id="premiumBtn">Premium</button>
      <button class="ads-btn" id="adsBtn">Anuncios</button>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

  <!-- PANTALLA HOME -->
  <section id="screen-home">
    <div class="main-actions">
      <button class="action-btn" id="btnDecidir">DECIDE POR MÍ</button>
      <button class="action-btn" id="btnPregunta">PREGUNTA A LA IA</button>
    </div>
  </section>

  <!-- PANTALLA CHAT DECIDIR -->
  <section id="screen-decidir" class="hidden">
    <div class="chat-box" id="chatDecidir"></div>

    <div class="input-area" id="inputAreaDecidir">
      <input type="text" id="inputDecidir" placeholder="Escribe opciones... (Pizza o Pollo)" />
      <button id="enviarDecidir">ENVIAR</button>
    </div>

    <button id="volverDecidir" class="back-chat">⬅ Volver</button>
  </section>

  <!-- PANTALLA CHAT IA -->
  <section id="screen-ia" class="hidden">
    <div class="chat-box" id="chatIA"></div>

    <div class="input-area" id="inputAreaIA">
      <input type="text" id="inputIA" placeholder="Pregúntame algo..." />
      <button id="enviarIA">ENVIAR</button>
    </div>

    <button id="volverIA" class="back-chat">⬅ Volver</button>
  </section>

  </main>
<script src="app.js"></script>
</body>
</html>
